name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: test
        run: >
          PYTHONPATH=skills/wiki-add:skills/wiki-quiz:skills/wiki-goal:skills/wiki-insight:scripts uv run --no-project --with pytest --with pytest-cov
          --with 'markitdown[pdf,docx,pptx]==0.1.9' --with fsrs==6.3.2
          python -m pytest tests --cov=learn --cov=quiz --cov=build_zip --cov=goal --cov=index --cov=insight --cov-branch --cov-fail-under=90
      - name: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import json; print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists; skipping release"
            exit 0
          fi
          python3 scripts/build_zip.py --out-dir dist
          gh release create "$tag" dist/*.zip --target "$GITHUB_SHA" --title "$tag" --generate-notes
